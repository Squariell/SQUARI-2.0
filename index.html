<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQUARI 2.0</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        
        /* Шапка */
        #header { background: #075e54; color: white; padding: 15px; font-weight: bold; font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* Окно сообщений */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        
        /* Стиль сообщения */
        .msg { 
            background: white; 
            padding: 8px 12px; 
            margin: 5px 0; 
            border-radius: 12px; 
            max-width: 80%; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.1); 
            word-wrap: break-word;
            align-self: flex-start;
        }

        /* Поле ввода */
        #input-area { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; align-items: center; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; font-size: 16px; }
        
        /* Кнопка */
        button { 
            margin-left: 10px; 
            background: #075e54; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            font-size: 20px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:active { background: #128c7e; }
    </style>
</head>
<body>

    <div id="header">SQUARI Messenger</div>
    <div id="messages"></div>

    <div id="input-area">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
        <button id="sendBtn">➤</button>
    </div>

    <!-- Подключаем Firebase -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onChildAdded } from "https://gstatic.com";

        // Твои настройки
        const firebaseConfig = {
            databaseURL: "https://firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const msgRef = ref(db, 'messages');

        const input = document.getElementById('messageInput');
        const btn = document.getElementById('sendBtn');
        const messagesDiv = document.getElementById('messages');

        // Функция отправки
        function doSend() {
            const text = input.value.trim();
            if (text !== "") {
                push(msgRef, {
                    text: text,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                }).then(() => {
                    console.log("Успешно отправлено");
                }).catch((e) => {
                    alert("Ошибка базы: " + e.message);
                });
                input.value = "";
            }
        }

        // Клик по кнопке
        btn.onclick = doSend;

        // Отправка по Enter
        input.onkeypress = (e) => { if (e.key === 'Enter') doSend(); };

        // Получение сообщений
        onChildAdded(msgRef, (snap) => {
            const data = snap.val();
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<div>${data.text}</div><small style="color:gray; font-size:10px; display:block; text-align:right; margin-top:4px;">${data.time}</small>`;
            messagesDiv.appendChild(div);
            
            // Скролл вниз
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
    </script>
</body>
</html>
