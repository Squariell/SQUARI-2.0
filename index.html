<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>SQUARI 2.0</title>
    <!-- Самая стабильная версия библиотеки -->
    <script src="https://pubnub.com"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; overflow: hidden; }
        #setup { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #header { background: #075e54; color: white; padding: 12px; font-weight: bold; text-align: center; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; padding-bottom: 60px; }
        .msg { padding: 8px 12px; margin: 4px 0; border-radius: 12px; max-width: 75%; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg.my { align-self: flex-end; background: #dcf8c6; }
        .msg.other { align-self: flex-start; background: white; }
        #input-area { position: fixed; bottom: 0; width: 100%; display: flex; padding: 8px; background: #f0f0f0; border-top: 1px solid #ccc; box-sizing: border-box; }
        #mInput { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { margin-left: 8px; background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
        .inp-setup { margin: 8px; padding: 12px; width: 80%; border-radius: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div id="setup">
    <h2>SQUARI 2.0</h2>
    <input type="text" id="uName" class="inp-setup" placeholder="Имя">
    <input type="text" id="rName" class="inp-setup" placeholder="ID чата">
    <button style="width:80%; border-radius:10px; height:50px; background:#075e54; color:white; border:none;" onclick="init()">ВОЙТИ</button>
</div>

<div id="header">Чат: <span id="roomTitle">...</span></div>
<div id="messages"></div>

<div id="input-area">
    <input type="text" id="mInput" placeholder="Сообщение...">
    <button onclick="send()">➤</button>
</div>

<script>
    var pn, chan, me;

    function init() {
        me = document.getElementById('uName').value.trim();
        chan = document.getElementById('rName').value.trim();
        if(!me || !chan) return alert("Заполни поля!");

        document.getElementById('roomTitle').innerText = chan;
        document.getElementById('setup').style.display = 'none';

        // Инициализация PubNub
        pn = new PubNub({
            publishKey: 'pub-c-46132049-74d3-490b-9523-28f095d67711',
            subscribeKey: 'sub-c-1049969a-0e9e-4e67-96a6-f14d872f2d93',
            uuid: me
        });

        pn.subscribe({ channels: [chan] });

        pn.addListener({
            message: function(m) {
                var div = document.createElement("div");
                div.className = "msg " + (m.message.user === me ? "my" : "other");
                div.innerHTML = "<b>" + m.message.user + "</b><br>" + m.message.text;
                document.getElementById('messages').appendChild(div);
                document.getElementById('messages').scrollTop = 999999;
            }
        });
    }

    function send() {
        var input = document.getElementById('mInput');
        if (input.value.trim() && pn) {
            pn.publish({
                channel: chan,
                message: { user: me, text: input.value }
            }, function(status, response) {
                if (status.error) { alert("Ошибка: " + status.errorData); }
            });
            input.value = "";
        }
    }
</script>
</body>
</html>
