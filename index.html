<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>SQUARI 2.0</title>
    <script src="https://pubnub.com"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; overflow: hidden; }
        #setup { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #header { background: #075e54; color: white; padding: 12px; font-weight: bold; text-align: center; font-size: 16px; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { background: white; padding: 8px 12px; margin: 4px 0; border-radius: 10px; align-self: flex-start; max-width: 80%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); font-size: 14px; }
        #input-area { display: flex; padding: 8px; background: #f0f0f0; border-top: 1px solid #ccc; align-items: center; }
        .inp { margin: 5px; padding: 10px; width: 80%; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; height: 40px; box-sizing: border-box; }
        #mInput { flex: 1; padding: 0 15px; border-radius: 20px; border: 1px solid #ccc; height: 36px; font-size: 14px; outline: none; }
        button { margin-left: 8px; background: #075e54; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 16px; }
        .btn-main { border-radius: 10px; width: 80%; height: 45px; background: #075e54; color: #fff; font-size: 16px; border: none; margin-top: 10px; }
    </style>
</head>
<body>

<div id="setup">
    <h2 style="color:#075e54">SQUARI</h2>
    <input type="text" id="uName" class="inp" placeholder="Твое имя">
    <input type="text" id="rName" class="inp" placeholder="ID чата">
    <button class="btn-main" onclick="init()">ВОЙТИ</button>
</div>

<div id="header">Чат: <span id="roomTitle">...</span></div>
<div id="messages"></div>
<div id="input-area">
    <input type="text" id="mInput" placeholder="Сообщение...">
    <button onclick="send()">➤</button>
</div>

<script>
    var pubnub, channel, myName;

    function init() {
        myName = document.getElementById('uName').value.trim();
        channel = document.getElementById('rName').value.trim();
        if(!myName || !channel) return alert("Заполни поля!");

        document.getElementById('roomTitle').innerText = channel;
        document.getElementById('setup').style.display = 'none';

        pubnub = new PubNub({
            publishKey: 'pub-c-46132049-74d3-490b-9523-28f095d67711',
            subscribeKey: 'sub-c-1049969a-0e9e-4e67-96a6-f14d872f2d93',
            userId: myName
        });

        pubnub.subscribe({ channels: [channel] });

        pubnub.addListener({
            message: function(m) {
                var div = document.createElement("div");
                div.className = "msg";
                div.innerHTML = "<b>" + m.message.user + "</b><br>" + m.message.text;
                document.getElementById('messages').appendChild(div);
                document.getElementById('messages').scrollTop = 999999;
            }
        });
        
        // Тестовый сигнал
        send("Вошел в чат");
    }

    function send(txt) {
        var input = document.getElementById('mInput');
        var messageText = txt || input.value.trim();
        if (messageText && pubnub) {
            pubnub.publish({
                channel: channel,
                message: { user: myName, text: messageText }
            });
            input.value = "";
        }
    }
</script>
</body>
</html>
