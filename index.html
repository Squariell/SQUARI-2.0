<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQUARI 2.0</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        #header { background: #075e54; color: white; padding: 15px; font-weight: bold; font-size: 20px; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { background: white; padding: 10px; margin: 5px 0; border-radius: 12px; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); align-self: flex-start; }
        #input-area { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        button { margin-left: 10px; background: #075e54; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; }
    </style>
</head>
<body>
    <div id="header">SQUARI Messenger</div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="messageInput" placeholder="Введите сообщение...">
        <button id="sendBtn">➤</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onChildAdded, onValue } from "https://gstatic.com";

        const firebaseConfig = {
            databaseURL: "https://firebaseio.com"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            const msgRef = ref(db, 'messages');

            // Проверка связи с базой
            onValue(ref(db, '.info/connected'), (snap) => {
                if (snap.val() === true) { console.log("Связь с базой есть!"); } 
                else { console.log("Связи нет..."); }
            });

            const input = document.getElementById('messageInput');
            const btn = document.getElementById('sendBtn');

            btn.onclick = () => {
                const text = input.value.trim();
                if (text !== "") {
                    push(msgRef, {
                        text: text,
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    }).catch(e => alert("Ошибка отправки: " + e.message));
                    input.value = "";
                }
            };

            onChildAdded(msgRef, (snap) => {
                const data = snap.val();
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<div>${data.text}</div><small style="color:gray; font-size:10px;">${data.time}</small>`;
                document.getElementById('messages').appendChild(div);
                document.getElementById('messages').scrollTop = 999999;
            });
        } catch (e) {
            alert("Ошибка запуска: " + e.message);
        }
    </script>
</body>
</html>
