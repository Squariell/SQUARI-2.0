<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>SQUARI 2.0</title>
    <script src="https://pubnub.com"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; overflow: hidden; }
        #setup { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #header { background: #075e54; color: white; padding: 12px; font-weight: bold; text-align: center; font-size: 16px; z-index: 10; }
        
        /* Зона сообщений */
        #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; padding-bottom: 70px; }
        
        /* Пузыри сообщений */
        .msg { padding: 8px 12px; margin: 4px 0; border-radius: 12px; max-width: 75%; font-size: 14px; line-height: 1.4; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg.my { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }
        .u-name { font-weight: bold; font-size: 11px; margin-bottom: 2px; color: #075e54; }

        /* Поле ввода - ТЕПЕРЬ ВСЕГДА ВНИЗУ */
        #input-area { position: absolute; bottom: 0; width: 100%; display: flex; padding: 8px; background: #f0f0f0; border-top: 1px solid #ccc; box-sizing: border-box; align-items: center; }
        #mInput { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; height: 40px; font-size: 16px; outline: none; box-sizing: border-box; }
        
        .inp-setup { margin: 8px; padding: 12px; width: 80%; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
        .btn-send { margin-left: 8px; background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; flex-shrink: 0; }
        .btn-main { border-radius: 10px; width: 80%; height: 50px; background: #075e54; color: #fff; font-size: 16px; border: none; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div id="setup">
    <h2 style="color:#075e54; margin-bottom:20px;">SQUARI 2.0</h2>
    <input type="text" id="uName" class="inp-setup" placeholder="Твое имя">
    <input type="text" id="rName" class="inp-setup" placeholder="ID чата (секретный код)">
    <button class="btn-main" onclick="init()">ВОЙТИ В ЧАТ</button>
</div>

<div id="header">Чат: <span id="roomTitle">...</span></div>
<div id="messages"></div>

<div id="input-area">
    <input type="text" id="mInput" placeholder="Сообщение...">
    <button class="btn-send" onclick="send()">➤</button>
</div>

<script>
    var pubnub, channel, myName;

    function init() {
        myName = document.getElementById('uName').value.trim();
        channel = document.getElementById('rName').value.trim();
        if(!myName || !channel) return alert("Введите имя и ID чата!");

        document.getElementById('roomTitle').innerText = channel;
        document.getElementById('setup').style.display = 'none';

        pubnub = new PubNub({
            publishKey: 'pub-c-46132049-74d3-490b-9523-28f095d67711',
            subscribeKey: 'sub-c-1049969a-0e9e-4e67-96a6-f14d872f2d93',
            userId: myName
        });

        pubnub.subscribe({ channels: [channel] });

        pubnub.addListener({
            message: function(m) {
                var isMy = (m.message.user === myName);
                var div = document.createElement("div");
                div.className = "msg " + (isMy ? "my" : "other");
                div.innerHTML = "<div class='u-name'>" + m.message.user + "</div><div>" + m.message.text + "</div>";
                document.getElementById('messages').appendChild(div);
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            }
        });
    }

    function send() {
        var input = document.getElementById('mInput');
        var text = input.value.trim();
        if (text && pubnub) {
            pubnub.publish({
                channel: channel,
                message: { user: myName, text: text }
            });
            input.value = "";
        }
    }

    // Отправка по кнопке Enter на клавиатуре
    document.getElementById('mInput').addEventListener("keyup", function(event) {
        if (event.key === "Enter") { send(); }
    });
</script>
</body>
</html>
