<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQUARI 2.0</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        #setup { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { background: white; padding: 10px; margin: 5px 0; border-radius: 12px; align-self: flex-start; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.my { align-self: flex-end; background: #dcf8c6; }
        #input-area { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { margin-left: 10px; background: #075e54; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; }
    </style>
</head>
<body>

<div id="setup">
    <h2>SQUARI</h2>
    <input type="text" id="u" style="width:80%; padding:10px; margin:5px;" placeholder="Имя">
    <input type="text" id="r" style="width:80%; padding:10px; margin:5px;" placeholder="ID чата">
    <button style="width:80%; border-radius:10px;" onclick="init()">ВОЙТИ</button>
</div>

<div id="messages"></div>
<div id="input-area">
    <input type="text" id="i" placeholder="Сообщение...">
    <button onclick="send()">➤</button>
</div>

<script>
    let room, name;
    let eventSource;

    function init() {
        name = document.getElementById('u').value;
        room = document.getElementById('r').value;
        if(!name || !room) return alert("Заполни!");
        document.getElementById('setup').style.display = 'none';
        
        // Подключаемся к бесплатному серверу уведомлений
        eventSource = new EventSource(`https://ntfy.sh{room}/sse`);
        eventSource.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if(data.message) {
                const isMy = data.title === name;
                const div = document.createElement("div");
                div.className = "msg" + (isMy ? " my" : "");
                div.innerHTML = `<b>${data.title}</b><br>${data.message}`;
                document.getElementById('messages').appendChild(div);
                document.getElementById('messages').scrollTop = 999999;
            }
        };
    }

    function send() {
        const input = document.getElementById('i');
        const text = input.value;
        if(!text) return;
        
        fetch(`https://ntfy.sh{room}`, {
            method: 'POST',
            body: text,
            headers: { 'Title': name }
        });
        input.value = "";
    }
</script>
</body>
</html>
