<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQUARI</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { background: white; padding: 8px 12px; margin: 5px 0; border-radius: 15px; max-width: 80%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        #input-area { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        button { margin-left: 10px; background: #075e54; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="messageInput" placeholder="Сообщение...">
        <button id="sendBtn">➤</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onChildAdded } from "https://gstatic.com";

        const app = initializeApp({ databaseURL: "https://firebaseio.com" });
        const db = getDatabase(app);
        const msgRef = ref(db, 'messages');

        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('messageInput');
            if (input.value.trim() !== "") {
                push(msgRef, { text: input.value, time: new Date().toLocaleTimeString() });
                input.value = "";
            }
        };

        onChildAdded(msgRef, (snap) => {
            const data = snap.val();
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<div>${data.text}</div><small style="color:gray; font-size:10px;">${data.time}</small>`;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = 999999;
        });
    </script>
</body>
</html>
