<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQUARI 2.0</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        #setup { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { background: white; padding: 10px; margin: 5px 0; border-radius: 12px; align-self: flex-start; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.my { align-self: flex-end; background: #dcf8c6; }
        #input-area { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { margin-left: 10px; background: #075e54; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; }
    </style>
</head>
<body>

<div id="setup" id="setupScreen">
    <h2>SQUARI</h2>
    <input type="text" id="uName" style="width:80%; padding:10px; margin:5px;" placeholder="Имя">
    <input type="text" id="rName" style="width:80%; padding:10px; margin:5px;" placeholder="ID чата">
    <button style="width:80%; border-radius:10px; height:50px; background:#075e54; color:white; border:none;" onclick="init()">ВОЙТИ</button>
</div>

<div id="messages" id="msgBox"></div>
<div id="input-area">
    <input type="text" id="msgInput" placeholder="Сообщение...">
    <button onclick="send()">➤</button>
</div>

<script>
    let room, name;

    function init() {
        name = document.getElementById('uName').value;
        room = document.getElementById('rName').value;
        if(!name || !room) return alert("Заполни!");
        document.getElementById('setup').style.display = 'none';
        
        // Подключаемся к комнате
        const source = new EventSource(`https://ntfy.sh{room}/sse`);
        source.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.message && data.title !== name) {
                renderMsg(data.title, data.message, false);
            }
        };
    }

    function renderMsg(user, text, isMy) {
        const div = document.createElement("div");
        div.className = "msg" + (isMy ? " my" : "");
        div.innerHTML = `<b>${user}</b><br>${text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 999999;
    }

    function send() {
        const input = document.getElementById('msgInput');
        const text = input.value;
        if(!text) return;
        
        // Сначала рисуем у себя
        renderMsg(name, text, true);
        
        // Потом отправляем в сеть
        fetch(`https://ntfy.sh{room}`, {
            method: 'POST',
            body: text,
            headers: { 'Title': name }
        }).catch(err => console.log("Ошибка сети, но сообщение отрисовано"));
        
        input.value = "";
    }
</script>
</body>
</html>
