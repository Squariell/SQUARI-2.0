<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQUARI 2.0</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        #header { background: #075e54; color: white; padding: 15px; font-weight: bold; text-align: center; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { background: white; padding: 10px; margin: 5px 0; border-radius: 12px; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 16px; }
        #input-area { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        button { margin-left: 10px; background: #075e54; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">SQUARI MESSENGER</div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Пиши сюда...">
        <button onclick="send()">➤</button>
    </div>

    <!-- Загружаем библиотеку -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Инициализация твоей базы
        var config = { databaseURL: "https://squari-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        var db = firebase.database().ref("messages");

        // Функция отправки
        function send() {
            var val = document.getElementById("msgInput").value;
            if (val.trim() !== "") {
                db.push({
                    text: val,
                    time: new Date().toLocaleTimeString()
                });
                document.getElementById("msgInput").value = "";
            }
        }

        // Функция получения
        db.on("child_added", function(snap) {
            var data = snap.val();
            var div = document.createElement("div");
            div.className = "msg";
            div.innerHTML = "<div>" + data.text + "</div><small style='color:gray; font-size:10px;'>" + data.time + "</small>";
            document.getElementById("messages").appendChild(div);
            document.getElementById("messages").scrollTop = 999999;
        });
    </script>
</body>
</html>
